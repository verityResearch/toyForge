base_model: Qwen/Qwen3-8B-Instruct
method: grpo
runtime: llamacpp
output_dir: out/phase2-grpo-llamacpp
adapter_init: out/phase1-sft/adapter
data:
  train: data/train.jsonl
  dev: data/dev.jsonl
lora:
  r: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05
grpo:
  num_generations: 8
  rollout_temperature: 0.7
  beta: 0.04
  reward_scaling: 1.0
  rubric_preset: shaped
llamacpp:
  base_url: http://localhost:8080/v1
  model: Qwen3-8B-Instruct-GGUF
  api_key_env: LLAMA_CPP_API_KEY
  grammar_path: schemas/jsonrpc.gbnf
  constrained: true
  reference_adapter_scale: 0.0
