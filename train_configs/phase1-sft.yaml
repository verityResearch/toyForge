base_model: Qwen/Qwen3-8B-Instruct
method: vanilla
output_dir: out/phase1-sft
data:
  train: data/train.jsonl
  dev:   data/dev.jsonl
lora:
  r: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05
context:
  train: 8192
optimizer: paged_adamw_8bit
batch_size: 1
grad_accum: 16
lr: 2.0e-5
warmup_ratio: 0.05
lr_scheduler_type: cosine
num_epochs: 3
attn_impl: sdpa   # was flash_attention_2 in plan; sdpa fallback since flash-attn isn't installable on this machine
seed: 42
