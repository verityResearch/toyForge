[project]
name = "toyforge"
version = "0.1.0"
description = "Reasoning-model training pipeline for verifiable JSON-RPC tool calls"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0.1",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.optional-dependencies]
train = [
    "torch>=2.13.0",
    "transformers>=4.56",
    "trl>=1.0",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=1.4",
    "datasets>=4.7",
    # flash-attn requires NVIDIA GPU + nvcc; install separately:
    #   pip install flash-attn --no-build-isolation
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "tensorboard>=2.18",
]

[project.scripts]
toyforge = "toyforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toyforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/toyforge"]
